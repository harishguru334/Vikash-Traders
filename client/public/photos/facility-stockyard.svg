<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="70%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="warehouse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="door" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="500" fill="url(#sky)"/>

  <!-- Warehouse Building Structure -->
  <polygon points="40,240 280,140 560,240 560,460 40,460" fill="url(#warehouse)"/>
  <polygon points="30,240 280,135 570,240 560,255 280,150 40,255" fill="#475569"/>

  <!-- Main Dispatch Bay Door (Red Frame as in Screenshot 3) -->
  <rect x="180" y="240" width="240" height="220" fill="#0f172a" stroke="url(#door)" stroke-width="16"/>
  <rect x="200" y="260" width="200" height="200" fill="#020617"/>

  <!-- Signboard Above Door -->
  <rect x="160" y="195" width="280" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="300" y="222" fill="#0f172a" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">VIKASH TRADERS</text>

  <!-- Staged Equipment Inside & Outside Dispatch Bay -->
  <!-- Green Dustbin in Foreground -->
  <g transform="translate(320, 240)">
    <rect x="30" y="20" width="130" height="20" rx="4" fill="#14532d"/>
    <path d="M40 40 L55 210 L135 210 L150 40 Z" fill="#15803d"/>
    <circle cx="60" cy="210" r="22" fill="#111827"/>
    <circle cx="130" cy="210" r="22" fill="#111827"/>
    <text x="95" y="125" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">240L</text>
  </g>

  <!-- Yellow Dustbin Beside -->
  <g transform="translate(190, 280)">
    <rect x="20" y="15" width="90" height="15" rx="3" fill="#92400e"/>
    <path d="M28 30 L40 170 L90 170 L102 30 Z" fill="#d97706"/>
    <circle cx="45" cy="170" r="18" fill="#111827"/>
    <circle cx="85" cy="170" r="18" fill="#111827"/>
  </g>

  <!-- Concrete Ground -->
  <rect y="450" width="600" height="50" fill="#64748b"/>

  <!-- Badge Overlay -->
  <rect x="30" y="30" width="220" height="34" rx="17" fill="rgba(18, 59, 50, 0.85)"/>
  <text x="45" y="52" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Kankarwala Central Facility</text>
</svg>