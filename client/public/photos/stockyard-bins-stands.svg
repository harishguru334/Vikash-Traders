<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123B32"/>
      <stop offset="100%" stop-color="#0c2721"/>
    </linearGradient>
    <linearGradient id="binGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F765B"/>
      <stop offset="100%" stop-color="#1cb07e"/>
    </linearGradient>
    <linearGradient id="binGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D89B35"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg1)"/>
  <rect y="320" width="600" height="130" fill="#081c16"/>
  <!-- Floor Grid Lines -->
  <line x1="0" y1="380" x2="600" y2="380" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  
  <!-- 240L Green Bin -->
  <g transform="translate(100, 110)">
    <rect x="40" y="30" width="120" height="20" rx="4" fill="#0e4435"/>
    <path d="M50 50 L65 240 L135 240 L150 50 Z" fill="url(#binGrad1)"/>
    <circle cx="70" cy="240" r="24" fill="#1f2937"/>
    <circle cx="70" cy="240" r="10" fill="#9ca3af"/>
    <circle cx="130" cy="240" r="24" fill="#1f2937"/>
    <circle cx="130" cy="240" r="10" fill="#9ca3af"/>
    <text x="100" y="140" fill="rgba(255,255,255,0.9)" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">240L HDPE</text>
    <text x="100" y="165" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11" text-anchor="middle">SWACCH BHARAT</text>
  </g>

  <!-- Yellow Heavy Bin -->
  <g transform="translate(240, 130)">
    <rect x="35" y="25" width="110" height="18" rx="4" fill="#b45309"/>
    <path d="M45 43 L58 220 L122 220 L135 43 Z" fill="url(#binGrad2)"/>
    <circle cx="62" cy="220" r="20" fill="#1f2937"/>
    <circle cx="62" cy="220" r="8" fill="#9ca3af"/>
    <circle cx="118" cy="220" r="20" fill="#1f2937"/>
    <circle cx="118" cy="220" r="8" fill="#9ca3af"/>
    <text x="90" y="130" fill="rgba(255,255,255,0.9)" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">120L PEDAL</text>
  </g>

  <!-- Stainless Steel Queue Stanchions -->
  <g transform="translate(380, 100)">
    <!-- Base -->
    <ellipse cx="60" cy="265" rx="35" ry="10" fill="url(#chrome)"/>
    <ellipse cx="140" cy="265" rx="35" ry="10" fill="url(#chrome)"/>
    <!-- Post -->
    <rect x="55" y="70" width="10" height="195" rx="2" fill="url(#chrome)"/>
    <circle cx="60" cy="65" r="9" fill="url(#chrome)"/>
    <rect x="135" y="70" width="10" height="195" rx="2" fill="url(#chrome)"/>
    <circle cx="140" cy="65" r="9" fill="url(#chrome)"/>
    <!-- Retractable Red Ribbon -->
    <path d="M60 85 Q100 95 140 85" stroke="#ef4444" stroke-width="14" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Tag overlay -->
  <rect x="25" y="25" width="190" height="34" rx="17" fill="rgba(255,255,255,0.12)"/>
  <text x="40" y="47" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Stockyard Storage Facility</text>
</svg>