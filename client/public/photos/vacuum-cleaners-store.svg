<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123B32"/>
      <stop offset="100%" stop-color="#081c16"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg5)"/>
  <rect y="330" width="600" height="120" fill="#040d0a"/>
  <!-- Commercial Vacuums -->
  <g transform="translate(140, 110)">
    <!-- 80L Stainless Drum Vacuum -->
    <rect x="60" y="90" width="90" height="120" rx="8" fill="#e2e8f0"/>
    <rect x="55" y="50" width="100" height="40" rx="6" fill="#1e3a8a"/>
    <rect x="85" y="35" width="40" height="15" rx="3" fill="#1e293b"/>
    <!-- Hose & Wheels -->
    <path d="M140 100 Q190 120 180 200" stroke="#0f172a" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle cx="70" cy="215" r="16" fill="#0f172a"/>
    <circle cx="140" cy="215" r="16" fill="#0f172a"/>

    <!-- Single Disc Polisher Machine -->
    <g transform="translate(170, 20)">
      <ellipse cx="90" cy="190" rx="42" ry="14" fill="#047857"/>
      <rect x="75" y="140" width="30" height="45" rx="4" fill="#d97706"/>
      <line x1="90" y1="140" x2="80" y2="40" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
      <rect x="55" y="30" width="50" height="12" rx="4" fill="#1e293b"/>
    </g>
  </g>
  <rect x="25" y="25" width="220" height="34" rx="17" fill="rgba(255,255,255,0.12)"/>
  <text x="40" y="47" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Industrial Floor Care Equipment</text>
</svg>