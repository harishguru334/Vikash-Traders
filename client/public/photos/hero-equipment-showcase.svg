<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2F765B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0c2721" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="binGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="binBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="binYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="chromePost" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="350" cy="260" r="300" fill="url(#glow)"/>

  <!-- Equipment Group Ground Shadow -->
  <ellipse cx="350" cy="450" rx="280" ry="25" fill="rgba(0,0,0,0.15)"/>

  <!-- Left: Blue 120L Waste Bin -->
  <g transform="translate(100, 150)">
    <rect x="25" y="25" width="105" height="18" rx="4" fill="#1e3a8a"/>
    <path d="M35 43 L48 240 L108 240 L120 43 Z" fill="url(#binBlue)"/>
    <circle cx="52" cy="240" r="22" fill="#111827"/>
    <circle cx="52" cy="240" r="9" fill="#9ca3af"/>
    <circle cx="104" cy="240" r="22" fill="#111827"/>
    <circle cx="104" cy="240" r="9" fill="#9ca3af"/>
    <text x="77" y="140" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">120L BLUE</text>
  </g>

  <!-- Center Hero: 240L Heavy Duty Green Bin -->
  <g transform="translate(230, 90)">
    <rect x="40" y="30" width="160" height="24" rx="6" fill="#14532d"/>
    <path d="M50 54 L70 320 L170 320 L190 54 Z" fill="url(#binGreen)"/>
    <circle cx="75" cy="320" r="32" fill="#111827"/>
    <circle cx="75" cy="320" r="14" fill="#cbd5e1"/>
    <circle cx="165" cy="320" r="32" fill="#111827"/>
    <circle cx="165" cy="320" r="14" fill="#cbd5e1"/>
    <!-- Stamp -->
    <rect x="80" y="140" width="80" height="70" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="120" y="170" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="18" text-anchor="middle">240L</text>
    <text x="120" y="195" fill="#f0fdf4" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">SWACCH BHARAT</text>
  </g>

  <!-- Right: 100L Yellow Bin -->
  <g transform="translate(430, 160)">
    <rect x="25" y="25" width="100" height="16" rx="4" fill="#92400e"/>
    <path d="M35 41 L46 220 L104 220 L115 41 Z" fill="url(#binYellow)"/>
    <circle cx="50" cy="220" r="20" fill="#111827"/>
    <circle cx="50" cy="220" r="8" fill="#9ca3af"/>
    <circle cx="100" cy="220" r="20" fill="#111827"/>
    <circle cx="100" cy="220" r="8" fill="#9ca3af"/>
    <text x="75" y="130" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">100L</text>
  </g>

  <!-- Stanchion in foreground (Right) -->
  <g transform="translate(540, 140)">
    <ellipse cx="40" cy="290" rx="36" ry="12" fill="url(#chromePost)"/>
    <rect x="35" y="90" width="10" height="200" fill="url(#chromePost)"/>
    <circle cx="40" cy="85" r="10" fill="url(#chromePost)"/>
    <path d="M40 105 Q10 130 -30 115" stroke="#dc2626" stroke-width="14" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Floating Quality Badge -->
  <g transform="translate(60, 340)">
    <rect width="180" height="60" rx="14" fill="#ffffff" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.12))"/>
    <circle cx="35" cy="30" r="18" fill="#eaf6f0"/>
    <text x="35" y="36" fill="#15803d" font-family="sans-serif" font-size="18" text-anchor="middle" font-weight="bold">✓</text>
    <text x="65" y="26" fill="#123B32" font-family="sans-serif" font-weight="bold" font-size="13">Direct B2B Sourcing</text>
    <text x="65" y="44" fill="#64748b" font-family="sans-serif" font-size="11">GST Tax Invoiced</text>
  </g>
</svg>