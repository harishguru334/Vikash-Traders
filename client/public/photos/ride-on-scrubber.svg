<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b3830"/>
      <stop offset="100%" stop-color="#0a1a15"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F765B"/>
      <stop offset="100%" stop-color="#144d3b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg2)"/>
  <rect y="330" width="600" height="120" fill="#081410"/>
  <!-- Machine Outline -->
  <g transform="translate(110, 110)">
    <path d="M40 180 L80 90 L260 90 L320 130 L340 180 L350 230 L20 230 Z" fill="url(#bodyGrad)"/>
    <!-- Operator seat & steering -->
    <rect x="90" y="45" width="45" height="50" rx="6" fill="#374151"/>
    <path d="M150 50 L170 85" stroke="#9ca3af" stroke-width="8" stroke-linecap="round"/>
    <circle cx="150" cy="50" r="14" fill="#111827"/>
    <!-- Front disc brushes -->
    <ellipse cx="310" cy="235" rx="35" ry="12" fill="#d97706"/>
    <!-- Wheels -->
    <circle cx="80" cy="230" r="32" fill="#1f2937"/>
    <circle cx="80" cy="230" r="14" fill="#6b7280"/>
    <circle cx="260" cy="230" r="32" fill="#1f2937"/>
    <circle cx="260" cy="230" r="14" fill="#6b7280"/>
    <!-- Headlight -->
    <circle cx="335" cy="140" r="10" fill="#fef08a"/>
    <text x="180" y="160" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="18">VK-SCRUB 1300</text>
    <text x="180" y="185" fill="#a7f3d0" font-family="sans-serif" font-size="12">Heavy Commercial Auto Scrubber</text>
  </g>
  <rect x="25" y="25" width="220" height="34" rx="17" fill="rgba(255,255,255,0.12)"/>
  <text x="40" y="47" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Ride-On Scrubber - Pre-Dispatch</text>
</svg>