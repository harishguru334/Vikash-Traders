<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164e63"/>
      <stop offset="100%" stop-color="#0e2b24"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg3)"/>
  <rect y="330" width="600" height="120" fill="#14532d"/>
  <!-- Open Gym Apparatus (Dual Air Walker & Arm Wheel) -->
  <g transform="translate(100, 90)">
    <!-- Main Upright Columns -->
    <rect x="100" y="40" width="18" height="210" rx="4" fill="#047857"/>
    <rect x="240" y="40" width="18" height="210" rx="4" fill="#047857"/>
    <rect x="80" y="40" width="198" height="14" rx="3" fill="#eab308"/>
    <!-- Air Walker Pendulums -->
    <line x1="130" y1="54" x2="115" y2="190" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <rect x="95" y="190" width="40" height="12" rx="4" fill="#1e293b"/>
    <line x1="210" y1="54" x2="225" y2="190" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <rect x="205" y="190" width="40" height="12" rx="4" fill="#1e293b"/>
    <!-- Arm Wheel (Right) -->
    <g transform="translate(300, 60)">
      <rect x="0" y="30" width="16" height="160" rx="3" fill="#047857"/>
      <circle cx="50" cy="65" r="42" stroke="#eab308" stroke-width="8" fill="none"/>
      <line x1="50" y1="23" x2="50" y2="107" stroke="#eab308" stroke-width="6"/>
      <line x1="8" y1="65" x2="92" y2="65" stroke="#eab308" stroke-width="6"/>
    </g>
  </g>
  <rect x="25" y="25" width="230" height="34" rx="17" fill="rgba(255,255,255,0.12)"/>
  <text x="40" y="47" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Ward Park Open-Gym Station</text>
</svg>